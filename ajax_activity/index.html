<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AJAX Username Checker</title>
</head>
<body>
  <h2>Check Username Availability</h2>
  <input type="text" id="username" placeholder="Enter username">
  <button onclick="checkUsername()">Check</button>
  <div id="status"></div>

  <script>
    async function checkUsername() {
      const username = document.getElementById('username').value;

      try {
        const response = await fetch('check_user.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: `username=${encodeURIComponent(username)}`
        });

        const data = await response.json();
        const messageBox = document.getElementById('status');
        messageBox.innerText = data.message;
        messageBox.style.color = data.available ? 'green' : 'red';

      } catch (error) {
        console.error('Error fetching data:', error);
      }
    }
  </script>
</body>
</html>
